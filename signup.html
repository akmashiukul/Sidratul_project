<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create your student account — Hostel Management System">
    <title>Sign Up — Hostel Management Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            display: flex; align-items: center; justify-content: center; padding: 40px 20px;
        }

        .card {
            background: #fff; border-radius: 20px;
            width: 100%; max-width: 580px;
            padding: 44px 48px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.4);
        }

        .card-header { text-align: center; margin-bottom: 32px; }
        .card-icon {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            border-radius: 16px; display: flex; align-items: center; justify-content: center;
            font-size: 28px; color: white; margin: 0 auto 16px;
        }
        .card-header h2 { font-size: 24px; font-weight: 800; color: #0f172a; margin-bottom: 6px; }
        .card-header p  { font-size: 14px; color: #64748b; }

        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }

        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 5px; }
        .input-wrap { position: relative; }
        .input-wrap i { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); color: #94a3b8; font-size: 14px; }
        .input-wrap input,
        .input-wrap select {
            width: 100%; padding: 11px 13px 11px 38px;
            border: 1.5px solid #e2e8f0; border-radius: 9px;
            font-size: 14px; font-family: 'Inter', sans-serif;
            outline: none; transition: border-color .2s, box-shadow .2s;
            background: #f8fafc; color: #0f172a;
            appearance: none;
        }
        .input-wrap input:focus,
        .input-wrap select:focus {
            border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,0.1); background: #fff;
        }
        .toggle-pass { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); color: #94a3b8; cursor: pointer; font-size: 14px; background: none; border: none; padding: 0; }

        .btn-submit {
            width: 100%; padding: 13px;
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: white; border: none; border-radius: 10px;
            font-size: 15px; font-weight: 600; cursor: pointer;
            transition: all .2s; margin-top: 8px;
            font-family: 'Inter', sans-serif;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-submit:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(79,70,229,0.35); }
        .btn-submit:disabled { opacity: .7; cursor: not-allowed; transform: none; }

        .alert {
            border-radius: 10px; padding: 12px 16px;
            font-size: 13px; font-weight: 500; margin-bottom: 20px;
            display: none; align-items: center; gap: 8px;
        }
        .alert.error   { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; }
        .alert.success { background: #f0fdf4; border: 1px solid #bbf7d0; color: #15803d; }
        .alert.show    { display: flex; }

        .login-link { text-align: center; font-size: 14px; color: #64748b; margin-top: 20px; }
        .login-link a { color: #4f46e5; font-weight: 600; text-decoration: none; }
        .login-link a:hover { text-decoration: underline; }

        .spinner { width: 16px; height: 16px; border: 2px solid rgba(255,255,255,0.4); border-top-color: white; border-radius: 50%; animation: spin .7s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<div class="card">
    <div class="card-header">
        <div class="card-icon"><i class="fa-solid fa-user-graduate"></i></div>
        <h2>Create Student Account</h2>
        <p>Fill in your details to register for hostel access</p>
    </div>

    <div class="alert error" id="alert-error"><i class="fa-solid fa-circle-exclamation"></i><span id="error-text"></span></div>
    <div class="alert success" id="alert-success"><i class="fa-solid fa-circle-check"></i><span id="success-text"></span></div>

    <form id="signup-form" onsubmit="handleSignup(event)">
        <div class="row">
            <div class="form-group">
                <label for="student_name">Full Name <span style="color:#ef4444">*</span></label>
                <div class="input-wrap">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" id="student_name" placeholder="Your full name" required>
                </div>
            </div>
            <div class="form-group">
                <label for="department">Department <span style="color:#ef4444">*</span></label>
                <div class="input-wrap">
                    <i class="fa-solid fa-book"></i>
                    <input type="text" id="department" placeholder="e.g. Computer Science" required>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="form-group">
                <label for="phone">Phone Number <span style="color:#ef4444">*</span></label>
                <div class="input-wrap">
                    <i class="fa-solid fa-phone"></i>
                    <input type="text" id="phone" placeholder="01XXXXXXXXX" required>
                </div>
            </div>
            <div class="form-group">
                <label for="guardian_name">Guardian Name <span style="color:#ef4444">*</span></label>
                <div class="input-wrap">
                    <i class="fa-solid fa-person"></i>
                    <input type="text" id="guardian_name" placeholder="Guardian's name" required>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label for="admin_id">Select Your Hostel / School <span style="color:#ef4444">*</span></label>
            <div class="input-wrap">
                <i class="fa-solid fa-school"></i>
                <select id="admin_id" required>
                    <option value="">Loading hostels…</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="email">Email Address <span style="color:#ef4444">*</span></label>
            <div class="input-wrap">
                <i class="fa-regular fa-envelope"></i>
                <input type="email" id="email" placeholder="you@example.com" required>
            </div>
        </div>

        <div class="form-group">
            <label for="password">Password <span style="color:#ef4444">*</span></label>
            <div class="input-wrap">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="password" placeholder="Minimum 6 characters" minlength="6" required>
                <button type="button" class="toggle-pass" onclick="togglePass()">
                    <i class="fa-regular fa-eye" id="eye-icon"></i>
                </button>
            </div>
        </div>

        <button type="submit" class="btn-submit" id="submit-btn">
            <i class="fa-solid fa-user-plus"></i> Create Account
        </button>
    </form>

    <div class="login-link">Already have an account? <a href="login.html">Sign in here</a></div>
</div>

<script>
    const API = 'http://localhost:3000/api';

    // Load admin list for dropdown
    async function loadAdmins() {
        try {
            const res  = await fetch(`${API}/admins/list`);
            const data = await res.json();
            const sel  = document.getElementById('admin_id');
            sel.innerHTML = '<option value="">— Select your hostel —</option>' +
                data.map(a => `<option value="${a.admin_id}">${a.admin_name}</option>`).join('');
        } catch {
            document.getElementById('admin_id').innerHTML = '<option value="">Could not load hostels</option>';
        }
    }

    function togglePass() {
        const input = document.getElementById('password');
        const icon  = document.getElementById('eye-icon');
        input.type  = input.type === 'password' ? 'text' : 'password';
        icon.className = input.type === 'password' ? 'fa-regular fa-eye' : 'fa-regular fa-eye-slash';
    }

    function showAlert(type, msg) {
        document.getElementById('alert-error').classList.remove('show');
        document.getElementById('alert-success').classList.remove('show');
        document.getElementById(`${type}-text`).textContent = msg;
        document.getElementById(`alert-${type}`).classList.add('show');
    }

    async function handleSignup(e) {
        e.preventDefault();
        const btn = document.getElementById('submit-btn');
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Creating account…';

        const body = {
            student_name:  document.getElementById('student_name').value.trim(),
            department:    document.getElementById('department').value.trim(),
            phone:         document.getElementById('phone').value.trim(),
            guardian_name: document.getElementById('guardian_name').value.trim(),
            admin_id:      document.getElementById('admin_id').value,
            email:         document.getElementById('email').value.trim(),
            password:      document.getElementById('password').value,
        };

        try {
            const res  = await fetch(`${API}/auth/signup`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(body)
            });
            const data = await res.json();

            if (!res.ok) { showAlert('error', data.error || 'Registration failed.'); return; }

            showAlert('success', 'Account created successfully! Redirecting to login…');
            document.getElementById('signup-form').reset();
            setTimeout(() => window.location.href = 'login.html', 2000);
        } catch {
            showAlert('error', 'Cannot reach server. Is Node.js running?');
        } finally {
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Create Account';
        }
    }

    window.addEventListener('load', loadAdmins);
</script>
</body>
</html>
